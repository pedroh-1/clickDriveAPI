spring.application.name=clickDriveAPI
# Configurações de Conexão com o Banco de Dados (XAMPP padrão)
spring.datasource.url=jdbc:mysql://localhost:3306/clickdrive_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate (JPA)
# O "update" é o que faz a tabela ser criada/atualizada automaticamente baseada na sua classe UsuarioModel
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true