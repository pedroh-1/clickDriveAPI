spring.application.name=clickDriveAPI
# Configuracoes de conexao com o banco de dados (XAMPP padrao)
spring.datasource.url=jdbc:mysql://localhost:3306/clickdrive_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Hibernate (JPA)
# O "update" cria/atualiza as tabelas automaticamente com base nos models.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
