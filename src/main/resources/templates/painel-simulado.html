<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Simulado DETRAN - ClickDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Simulado de Trânsito</h2>
            <small>Prova ID: <span th:text="${simulado.id}"></span></small>
        </div>
        <div class="card-body">

            <form th:action="@{/web/simulados/{id}/finalizar(id=${simulado.id})}" method="post">

                <div th:each="questao, stat : ${simulado.questoes}" class="mb-4 p-3 border rounded bg-white">
                    <h5 class="text-dark">
                        <span th:text="${stat.count}">1</span>.
                        <span th:text="${questao.enunciado}">Enunciado da Questão</span>
                    </h5>

                    <div class="mt-3">
                        <div th:each="opcao : ${questao.opcoes}" class="form-check mb-2">
                            <input class="form-check-input" type="radio"
                                   th:name="'questao_' + ${questao.id}"
                                   th:id="'opcao_' + ${opcao.id}"
                                   th:value="${opcao.id}" required>
                            <label class="form-check-label" th:for="'opcao_' + ${opcao.id}" th:text="${opcao.texto}">
                                Texto da Opção
                            </label>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success btn-lg px-5">Finalizar e Corrigir Prova</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
