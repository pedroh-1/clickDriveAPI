<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickDrive - Login</title>
  <link rel="stylesheet" th:href="@{/css/gestao-autoescola.css}">
</head>
<body>

<main class="login-shell">
  <section class="login-brand-panel">
    <div class="brand login-brand">
      <div class="brand-mark">CD</div>
      <div>
        <div class="brand-title">ClickDrive</div>
        <div class="brand-subtitle">Gestao da autoescola</div>
      </div>
    </div>
    <div class="login-copy">
      <h1>Area profissional</h1>
      <p>Entre para acessar simulados, questoes, pagamentos, avaliacoes e dicas do sistema.</p>
    </div>
  </section>

  <section class="login-content">
    <form class="panel login-card form-grid" th:action="@{/login}" method="POST">
      <div>
        <h2 class="page-title">Entrar</h2>
        <p class="page-kicker">Use suas credenciais cadastradas no ClickDrive.</p>
      </div>

      <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary login-button">Entrar</button>
    </form>
  </section>
</main>

</body>
</html>
