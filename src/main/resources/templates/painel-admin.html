<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ClickDrive - Painel do Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Painel do Administrador - Aprovação de Instrutores</h2>
    <hr>

    <table class="table table-striped table-bordered mt-4">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome do Candidato</th>
            <th>Credenciamento Solicitado</th>
            <th>Documentação (CNH)</th>
            <th>Status</th>
            <th>Data da Solicitação</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cand : ${listaCandidaturas}">
            <td th:text="${cand.id}">1</td>
            <td th:text="${cand.usuario.nome}">João da Silva</td>
            <td th:text="${cand.credenciamentoPretendido}">DETRAN-GO-000</td>
            <td>
                <a th:href="${cand.urlDocumentoPdf}" target="_blank" class="btn btn-outline-info btn-sm">
                    Visualizar PDF
                </a>
            </td>
            <td th:text="${cand.status}">PENDENTE</td>
            <td th:text="${cand.dataCriacao}">10/10/2026</td>
            <td>
                <button class="btn btn-success btn-sm" th:attr="onclick=|aprovarCandidatura('${cand.id}')|">
                    Aprovar Instrutor
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaCandidaturas)}">
            <td colspan="7" class="text-center">Nenhuma candidatura pendente no momento.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function aprovarCandidatura(id) {
        if(confirm("Deseja realmente aprovar e promover este usuário a Instrutor?")) {
            // Mantém a chamada PATCH perfeitamente integrada à API REST
            fetch('/candidaturas/' + id + '/aprovar', {
                method: 'PATCH'
            })
            .then(response => {
                if(response.ok) {
                    alert("Aprovado com sucesso! O sistema converteu o usuário para Instrutor.");
                    window.location.reload();
                } else {
                    alert("Erro ao aprovar. Verifique o console.");
                }
            });
        }
    }
</script>

</body>
</html>
