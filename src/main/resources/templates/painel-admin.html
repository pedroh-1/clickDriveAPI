<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ClickDrive - Painel do Administrador</title>
    <!-- Adicionando CSS do Bootstrap para ficar bonito -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Painel do Administrador - Aprovação de Instrutores</h2>
    <hr>

    <table class="table table-striped table-bordered mt-4">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome do Candidato</th>
            <th>Status</th>
            <th>Data da Solicitação</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody>
        <!-- O Thymeleaf vai repetir essa linha (tr) para cada candidatura pendente -->
        <tr th:each="cand : ${listaCandidaturas}">
            <td th:text="${cand.id}">1</td>
            <!-- Navegando pelo agregado: Candidatura -> Instrutor -> Nome -->
            <td th:text="${cand.instrutor.nome}">João da Silva</td>
            <td th:text="${cand.status}">PENDENTE</td>
            <td th:text="${cand.dataCriacao}">10/10/2026</td>
            <td>
                <!-- Botão que chama um JavaScript simples para aprovar usando a sua API REST -->
                <button class="btn btn-success btn-sm" th:attr="onclick=|aprovarCandidatura('${cand.id}')|">
                    Aprovar Instrutor
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaCandidaturas)}">
            <td colspan="5" class="text-center">Nenhuma candidatura pendente no momento.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    // Função JavaScript para testar a sua API na prática
    function aprovarCandidatura(id) {
        if(confirm("Deseja realmente aprovar e promover este usuário a Instrutor?")) {
            // Chama a rota PATCH da sua API documentada no Swagger
            fetch('/candidaturas/' + id + '/aprovar', {
                method: 'PATCH'
            })
            .then(response => {
                if(response.ok) {
                    alert("Aprovado com sucesso! O sistema converteu o usuário para Instrutor.");
                    window.location.reload(); // Recarrega a página para atualizar a lista
                } else {
                    alert("Erro ao aprovar. Verifique o console.");
                }
            });
        }
    }
</script>

</body>
</html>
